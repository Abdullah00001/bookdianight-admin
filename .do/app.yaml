name: bookdianight-admin-app
region: nyc3
domains:
  - domain: admin.bookdianight.com
    type: PRIMARY
static_sites:
  - name: bookdianight-admin-frontend
    github:
      branch: main
      repo: your-username/your-repo-name # IMPORTANT: Change to your exact GitHub repo (e.g., abdullah/bookdianight-admin)
      deploy_on_push: false
    build_command: npm run build
    output_dir: dist
    catchall_document: index.html
    environment_slug: node-js
